<a class="skip-link" href="#lectura">Ir a la lectura</a>

<header class="masthead">
  <span class="wordmark" translate="no">entre<span class="dash" aria-hidden="true"></span>líneas</span>
  <button
    type="button"
    class="theme"
    (click)="toggleTheme()"
    [attr.aria-label]="
      prefs.resolvedTheme() === 'dark' ? 'Cambiar a apariencia clara' : 'Cambiar a apariencia oscura'
    "
  >
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" />
      <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" />
    </svg>
  </button>
</header>

<main id="lectura">
  <app-reader />
</main>

@if (updateReady()) {
  <div class="update" role="status">
    <span>Hay una versión nueva.</span>
    <button type="button" (click)="reload()">Actualizar</button>
  </div>
}
